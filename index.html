function ic(n,s){s=s||17;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[n]||'')+'</svg>'}
const IKEY={ses:'trend',hggsp:'globe',histoire:'land',anglais:'lang',philosophie:'brain'};
const COL={ses:['#059669','#E9F8F1'],hggsp:['#4F46E5','#EDF0FE'],histoire:['#C2410C','#FDF0E7'],anglais:['#DB2777','#FCEFF5'],philosophie:['#9333EA','#F6EFFC']};
const mIc=m=>ic(IKEY[m.id]||'book',18);
function colOf(m){return COL[m.id]||['#2563EB','#EDF3FF']}

/* ---------- état / persistance ---------- */
const LS='sbv1';
let P={m:{},best:{}};
/* État local : on n'accepte que la bonne forme. Un localStorage abîmé, vidé à
   moitié ou écrit par une ancienne version ne doit JAMAIS casser le site. */
function normState(o){
  const s={m:{},best:{}};
  if(o&&typeof o==='object'&&!Array.isArray(o)){
    if(o.m&&typeof o.m==='object'&&!Array.isArray(o))for(const k in o.m){const a=o.m[k];if(Array.isArray(a))s.m[k]=a.filter(i=>Number.isInteger(i)&&i>=0)}
    if(o.best&&typeof o.best==='object'&&!Array.isArray(o))for(const k in o.best){const v=o.best[k];if(typeof v==='number'&&isFinite(v)&&v>=0)s.best[k]=Math.floor(v)}
  }
  return s;
}
try{P=normState(JSON.parse(localStorage.getItem(LS)))}catch(e){P={m:{},best:{}}}
function save(){try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}}
const kf=(mi,fi)=>D[mi].id+'_'+fi;
const cardCount=(mi,fi)=>(D[mi]&&D[mi].fiches[fi])?D[mi].fiches[fi].flashcards.length:0;
/* Les index mémorisés sont bornés à la fiche : si le contenu change (cartes
   ajoutées, retirées ou renumérotées), les index périmés sont purgés. */
function mast(mi,fi){
  const k=kf(mi,fi),n=cardCount(mi,fi),src=Array.isArray(P.m[k])?P.m[k]:[];
  const clean=[];let purge=false;
  src.forEach(i=>{if(Number.isInteger(i)&&i>=0&&i<n){if(!clean.includes(i))clean.push(i)}else purge=true});
  P.m[k]=clean;if(purge)save();return P.m[k];
}
function hasM(mi,fi,i){return mast(mi,fi).includes(i)}
function setM(mi,fi,i,v){const a=mast(mi,fi);if(v&&!a.includes(i)){a.push(i);save()}else if(!v&&a.includes(i)){a.splice(a.indexOf(i),1);save()}}
function remain(mi,fi){return Math.max(0,cardCount(mi,fi)-mast(mi,fi).length)}
function bestS(mi,fi){
  const v=P.best[kf(mi,fi)];const n=(D[mi]&&D[mi].fiches[fi])?D[mi].fiches[fi].quiz.length:0;
  if(typeof v!=='number'||!isFinite(v))return null;return Math.min(v,n);
}
function setBest(mi,fi,v){
  const n=(D[mi]&&D[mi].fiches[fi])?D[mi].fiches[fi].quiz.length:0;
  if(typeof v!=='number'||!isFinite(v)||n<=0)return;
  const k=kf(mi,fi);v=Math.min(Math.floor(v),n);
  if(P.best[k]==null||v>P.best[k]){P.best[k]=v;save()}
}
function pctM(mi){let t=0,a=0;D[mi].fiches.forEach((f,fi)=>{t+=f.flashcards.length;a+=mast(mi,fi).length});return t?Math.round(a/t*100):0}

/* ---------- routage ---------- */
function parse(){/* adresse invalide = on rentre à l'accueil, jamais de plantage */
  const h=String(location.hash||'').replace(/^#\/?/,'');if(!h||h==='home')return{home:1};
  const p=h.split('/');const mi=+p[1],fi=p[2]==null||p[2]===''?0:+p[2];
  const tab=['lire','fc','quiz'].includes(p[3])?p[3]:'lire';
  const bonne=p[0]==='f'&&Number.isInteger(mi)&&mi>=0&&mi<D.length&&Number.isInteger(fi)&&fi>=0&&fi<D[mi].fiches.length;
  if(bonne)return{home:0,mi,fi,tab};return{home:1}}
function go(h){location.hash='#/'+h}
function fiche(mi,fi,tab){go('f/'+mi+'/'+fi+'/'+(tab||'lire'))}
function onHome(){return parse().home}

/* ---------- thème ---------- */
function initTheme(){let t='light';try{t=localStorage.getItem('sbtheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}setTheme(t)}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sbtheme',t)}catch(e){}
  const c=$('#themeColor');if(c)c.content=t==='dark'?'#0A0F1C':'#ffffff';paintThemeBtn()}
function toggleTheme(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
function paintThemeBtn(){const b=$('#btnTheme');if(b)b.innerHTML=ic(document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon',16)}

/* ---------- rendu accueil ---------- */
function fmt(){return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function todayLabel(){const h=new Date().getHours();return h<6?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir'}
function renderHome(){
  const tot={fc:0,ma:0,f:0,q:0,w:0};
  D.forEach((m,mi)=>{m.fiches.forEach((f,fi)=>{tot.fc+=f.flashcards.length;tot.ma+=mast(mi,fi).length});tot.f+=m.fiches.length});
  D.forEach(m=>{tot.q+=m._nb.q;tot.w+=m._nb.wpw});
  const p=Math.round(tot.ma/Math.max(1,tot.fc)*100);
  let html=`<div class="hello">
    <span class="eyebrow">${todayLabel()} · ${fmt()}</span>
    <h1>Prépare-toi à réussir.</h1>
    <p>${tot.f} fiches construites à partir de tes cours : lis, mémorise les définitions, retourne les cartes et vérifie-toi avec les quiz.</p>
  </div>
  <div class="resume">
    <div class="rev">
      <h3>${ic('target',15)} Progression globale</h3>
      <div class="row"><span class="pct">${p}%</span><span class="lbl">${tot.ma} / ${tot.fc} cartes mémorisées</span></div>
      <div class="bar"><i style="width:${p}%"></i></div>
      <div class="act">
        <button class="btn b-acc" onclick="goResume()">${ic('light',15)} Reprendre la révision</button>
        <button class="btn b-line" onclick="document.querySelector('.sec')&&document.querySelector('.sec').scrollIntoView({behavior:'smooth'})">${ic('layers',15)} Mes matières</button>
      </div>
    </div>
    <div class="rev">
      <h3>${ic('checkc',15)} En bref</h3>
      <div class="kpis">
        ${kpi(ic('book',16),tot.f,'fiches','#EDF3FF','#2563EB')}
        ${kpi(ic('card',16),tot.fc,'cartes','#E7F7EF','#149A5A')}
        ${kpi(ic('brain',16),tot.q,'questions','#FCEFF5','#DB2777')}
      </div>
    </div>
  </div>
  <div class="sec"><h2>Matières</h2><span class="cnt">${D.length}</span></div>
  <div class="subj-list">`+
  D.map((m,mi)=>{const c=colOf(m),pc=pctM(mi),s=m._nb;
    return `<button class="subj" onclick="fiche(${mi},0,'lire')">
      <span class="s-ic" style="background:${c[1]};color:${c[0]}">${mIc(m)}</span>
      <span class="mid"><h3>${m.nom}</h3><div class="d">${esc(m.description)}</div>
        <div class="meta">
          <span class="m">${ic('book2',13)} ${s.fiches} fiche${s.fiches>1?'s':''}</span>
          <span class="m">${ic('layers',13)} ${s.fc} cartes</span>
          <span class="m">${ic('brain',13)} ${s.q} questions</span>
          <span class="m">${ic('target',13)} ${s.wpw} à savoir par cœur</span>
        </div>
        <div class="g-bar"><div class="bar"><i style="width:${pc}%"></i></div><span>${pc}%</span></div>
      </span>
      <span class="chev">${ic('chevR',18)}</span>
    </button>`}).join('')+`</div>
  <div class="tip">
    <span class="ic">${ic('mic',17)}</span>
    <div><h3>Tu as un nouveau cours ? Envoie-moi un vocal 🎙</h3>
    <p>Commence par « <b>SES2 début</b> », « <b>HGGSP1 fin</b> » ou « <b>Correction : …</b> ». Je mets la fiche à jour automatiquement.</p></div>
  </div>`;
  return html;
}
function kpi(icn,val,lbl,bg,fg){return `<div class="kpi"><span class="ic" style="background:${bg};color:${fg}">${icn}</span><div><b>${val}</b><span>${lbl}</span></div></div>`}
function goResume(){let best=null;
  D.forEach((m,mi)=>{m.fiches.forEach((f,fi)=>{if(remain(mi,fi)>0&&(!best||mast(mi,fi).length===0)){best={mi,fi}}})});
  fiche(best?best.mi:0,best?best.fi:0,'fc')}

/* ---------- rendu fiche ---------- */
function fh(mi,fi,tab){
  const m=D[mi],f=m.fiches[fi],c=colOf(m);
  const aud=(f.sources||[]).filter(n=>AUD.includes(n));
  const tags=[`<span class="chip" style="border:none;background:${c[1]};color:${c[0]};font-weight:700">${mIc(m)} ${m.nom}</span>`,
    `<span class="chip">Fiche ${fi+1} / ${m.fiches.length}</span>`];
  if(f.statut)tags.push(`<span class="chip" style="color:var(--warn);background:var(--warn-soft);border-color:transparent">${ic('clock',12)} ${esc(f.statut)}</span>`);
  const sw=m.fiches.length>1?`<div style="display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:2px">
    ${m.fiches.map((ff,i)=>`<button class="chip" style="cursor:pointer;${i===fi?'background:var(--ink);color:var(--bg);border-color:var(--ink)':''}" onclick="fiche(${mi},${i},'lire')">${i+1}. ${esc(ff.titre.split(':')[0])}</button>`).join('')}</div>`:'';
  const best=bestS(mi,fi);
  const mode=`<div class="mode">
    <button class="${tab==='lire'?'on':''}" onclick="fiche(${mi},${fi},'lire')">${ic('book2',14)} Lire</button>
    <button class="${tab==='fc'?'on':''}" onclick="fiche(${mi},${fi},'fc')">${ic('layers',14)} Cartes <span class="nb">${f.flashcards.length}</span></button>
    <button class="${tab==='quiz'?'on':''}" onclick="fiche(${mi},${fi},'quiz')">${ic('brain',14)} Quiz <span class="nb">${f.quiz.length}</span></button>
  </div>`;
  /* Lecture des prises de notes originales (.m4a) : la boîte reste MASQUÉE tant
     qu'aucun fichier n'est réellement disponible. Elle ne s'affiche que si le
     fichier local existe (événement loadedmetadata) et disparaît sinon : plus
     jamais de lecteur cassé sur le site public. */
  const audio=aud.length?`<div class="audio-box" style="display:none"><span class="cap">${ic('mic',13)} Réécouter la prise de notes originale</span>
    ${aud.map(n=>`<audio controls preload="metadata" style="display:none" src="media/${encodeURIComponent(n)}" onloadedmetadata="this.style.display='';var b=this.closest('.audio-box');if(b)b.style.display='';" onerror="var b=this.closest('.audio-box');this.remove();if(b&&!b.querySelector('audio'))b.remove();"></audio>`).join('')}</div>`:'';
  return `<div class="f-head">
    <div class="crumbs2"><button onclick="go('')">Accueil</button>${ic('chevR',11)}<button onclick="fiche(${mi},${fi},'lire')">${m.nom}</button>${ic('chevR',11)}<span style="font-weight:600;color:var(--ink)">Fiche ${fi+1}</span></div>
    <div class="tags">${tags.join('')}</div>
    <h1 class="f-title">${esc(f.titre)}</h1>
    <div class="tags">
      <span class="chip" title="Cartes mémorisées">${ic('checkc',12)} <b>${mast(mi,fi).length}/${f.flashcards.length}</b> maîtrisées</span>
      ${best!=null?`<span class="chip" title="Meilleur score">${ic('trophy',12)} <b>${best}/${f.quiz.length}</b> au quiz</span>`:''}
      <span class="chip">${ic('target',12)} <b>${wpwCount(mi,fi)}</b> déf. par cœur</span>
    </div>
    ${audio}${sw}${mode}</div>`;
}
function wpwCount(mi,fi){const f=D[mi].fiches[fi];return f.parties.reduce((a,p)=>a+p.blocs.filter(b=>b.type==='def'&&b.wpw).length,0)}

function clean(s){return String(s).replace(/<\s*\/?(?!b|i|u|em|br|strong|b\/|i\/)[a-zA-Z][^>]*>/g,'').replace(/<script[\s\S]*?<\/script>/gi,'')}
function blockHTML(b){
  if(b.type==='texte')return '<p>'+clean(b.texte)+'</p>';
  if(b.type==='liste')return '<ul class="pills">'+b.items.map(i=>'<li>'+clean(i)+'</li>').join('')+'</ul>';
  if(b.type==='def'){const wpw=b.wpw?' <span class="wpw">'+ic('spark',9)+' mot pour mot</span>':'';
    return `<div class="def"><span class="d-ic">${ic(b.wpw?'target':'book',17)}</span><div style="min-width:0"><span class="dt">${clean(b.terme)}${wpw}</span><p>${clean(b.texte)}</p></div></div>`}
  if(b.type==='exemple')return `<div class="ex">${ic('light',15)}<div><b>Exemple.</b> ${clean(b.texte)}</div></div>`;
  if(b.type==='note')return `<div class="notice2">${ic('light',15)}<div><b>À noter :</b> ${clean(b.texte)}</div></div>`;
  return '';
}
function renderLire(mi,fi){
  const f=D[mi].fiches[fi];
  return f.parties.map((p,i)=>{
    const rec=/retenir|essentiel/i.test(p.titre);
    return `<section class="part${rec?' recap':''}">
      <div class="ph"><span class="n">${i+1}</span><h2>${esc(p.titre)}</h2></div>
      ${p.sources?`<div class="psub">${p.sources.map(esc).join(' · ')}</div>`:''}
      ${p.blocs.map(blockHTML).join('')}</section>`}).join('');
}

/* ============ flashcards ============ */
let FQ={mi:0,fi:0,queue:[],pos:0,flipped:false,filter:'rev',mode:'study'};
function fcQueue(mi,fi,forceAll){
  const f=D[mi].fiches[fi];const all=f.flashcards.map((_,i)=>i);
  if(FQ.filter==='rev'&&!forceAll)return all.filter(i=>!hasM(mi,fi,i));
  return all.slice();
}
function startFC(mi,fi){FQ={mi,fi,queue:fcQueue(mi,fi),pos:0,flipped:false,filter:FQ.filter||'rev',mode:FQ.mode||'study'}}
function renderFc(mi,fi){
  const f=D[mi].fiches[fi];
  const bar=`<div class="fc-toolbar">
    <div class="seg">
      <button class="${FQ.filter==='rev'?'on':''}" onclick="FQ.filter='rev';startFC(${mi},${fi});paintFC()">${ic('target',13)} À réviser <span class="cnt">${remain(mi,fi)}</span></button>
      <button class="${FQ.filter==='all'?'on':''}" onclick="FQ.filter='all';startFC(${mi},${fi});paintFC()">${ic('layers',13)} Toutes <span class="cnt">${f.flashcards.length}</span></button>
    </div>
    <div class="seg">
      <button class="${FQ.mode==='study'?'on':''}" onclick="FQ.mode='study';startFC(${mi},${fi});paintFC()">${ic('light',13)} Réviser</button>
      <button class="${FQ.mode==='grid'?'on':''}" onclick="FQ.mode='grid';paintFC()">${ic('grid',13)} Grille</button>
    </div>
    <div class="grow"></div>
    <button class="btn b-line b-xs" onclick="melange()">${ic('shuffle',14)} Mélanger</button>
  </div><div id="fcBody"></div>`;
  return bar;
}
function melange(){const p=parse();FQ.queue=(FQ.filter==='rev'?fcQueue(p.mi,p.fi):fcQueue(p.mi,p.fi,true)).slice();FQ.pos=0;FQ.flipped=false;sh(FQ.queue);paintFC()}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function paintFC(){
  const el=$('#fcBody');if(!el)return;
  if(FQ.mode==='grid'){paintGrid();return}
  const p=parse();const f=D[p.mi].fiches[p.fi];
  if(!FQ.queue.length||FQ.pos>=FQ.queue.length){
    el.innerHTML=`<div class="study-done">
      <span class="ic">${ic('checkc',30)}</span>
      <h3>Séance terminée !</h3>
      <p>${f.flashcards.length-mast(p.mi,p.fi).length} carte${f.flashcards.length-mast(p.mi,p.fi).length>1?'s':''} restent à revoir${FQ.filter==='rev'?' — passe sur « Toutes » pour continuer.':'.'}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn b-acc" onclick="FQ.filter='rev';startFC(${p.mi},${p.fi});melange();paintFC()">${ic('rotate',14)} Revoir</button>
        ${FQ.filter==='rev'?`<button class="btn b-line" onclick="FQ.filter='all';startFC(${p.mi},${p.fi});paintFC()">Toutes les cartes</button>`:''}
      </div></div>`;
    return;
  }
  const idx=FQ.queue[FQ.pos];const c=f.flashcards[idx];const total=FQ.queue.length;
  FQ._idx=idx;
  el.innerHTML=`<div class="study">
    <div class="toprow"><span class="pos">Carte ${FQ.pos+1}/${total}</span><div class="bar"><i style="width:${FQ.pos/Math.max(1,total)*100}%"></i></div><span class="left">${remain(p.mi,p.fi)} à réviser</span></div>
    <div class="carte" id="carte" onclick="flipC()" role="button" tabindex="0" aria-label="Retourner la carte">
      <div class="in">
        <div class="face face-a"><div class="tag">Question</div><div class="q">${esc(c.face)}</div>
          <div class="sub">${ic('rotate',13)} Clique ou appuie sur Espace</div></div>
        <div class="face face-b"><div class="tag">Réponse</div><div class="q">${esc(c.verso)}</div></div>
      </div>
    </div>
    <div class="juge" id="juge">
      <button class="btn b-ko" onclick="juger(false)">${ic('x',15)} Pas encore</button>
      <button class="btn b-ok" onclick="juger(true)">${ic('check',15)} Je la savais</button>

/* ---------- helpers couleurs ---------- */
function _hx(c){c=String(c).replace('#','');return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)];}
function _mixW(c,t){const a=_hx(c);return 'rgb('+a.map(v=>Math.round(v+(255-v)*t)).join(',')+')';}
function _isDark(){return document.documentElement.getAttribute('data-theme')==='dark';}
function _setAcc(c){ /* c=[accent, soft] — variables matières adaptées au thème */
  const dark=_isDark();
  document.documentElement.style.setProperty('--mc', c[0]);
  document.documentElement.style.setProperty('--mct', dark?_mixW(c[0],0.55):c[0]);
  if(dark){const a=_hx(c[0]);document.documentElement.style.setProperty('--mcs','rgba('+a.join(',')+',0.16)');}
  else{document.documentElement.style.setProperty('--mcs', c[1]);}
}
function _dfData(mi,fi){return DF6[(mi)+'-'+(fi)];}

/* ---------- Défis express : moteur ---------- */
const DEF={on:false,mi:0,fi:0,qs:[],i:0,ok:0,bad:0,ph:[],lock:false,last:null};
const DEFMETA={vf:['Vrai ou Faux','check'],cloze:['Complète la phrase','edit'],order:['Remets dans l’ordre','layers'],intrus:["Trouve l’intrus",'x'],sort:['Classe par thème','grid']};
function _shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function _dfBest(mi,fi){try{return JSON.parse(localStorage.getItem('sbdef6')||'{}')[(mi)+'-'+(fi)]||null;}catch(e){return null;}}
function _dfSave(mi,fi,v){try{const o=JSON.parse(localStorage.getItem('sbdef6')||'{}');o[(mi)+'-'+(fi)]=v;localStorage.setItem('sbdef6',JSON.stringify(o));}catch(e){}}
function openDefis(mi,fi){
  const dd=_dfData(mi,fi); if(!dd){toast('Pas encore de défis pour cette fiche');return;}
  DEF.on=true;DEF.mi=mi;DEF.fi=fi;DEF.ok=0;DEF.bad=0;DEF.i=0;DEF.qs=[];DEF.lock=false;
  dd.ch.forEach(function(g){
    if(g.t==='vf') g.items.forEach(function(it){DEF.qs.push(Object.assign({},it,{type:'vf'}));});
    else if(g.t==='cloze') g.items.forEach(function(it){DEF.qs.push(Object.assign({},it,{type:'cloze'}));});
    else if(g.t==='order') DEF.qs.push({type:'order',items:g.items,title:g.title,consigne:g.consigne});
    else if(g.t==='intrus') DEF.qs.push({type:'intrus',items:g.items,a:g.a,e:g.e,title:g.title,consigne:g.consigne});
    else if(g.t==='sort') DEF.qs.push({type:'sort',buckets:g.buckets,title:g.title,consigne:g.consigne});
  });
  let ov=document.getElementById('dfov');
  if(!ov){ov=document.createElement('div');ov.id='dfov';ov.className='dfov';ov.style.display='none';
    ov.innerHTML='<div class="sheet"><div class="dfhead"><div class="t"><b></b><span></span></div>'+
      '<button class="x" id="dfx">'+ic('x',19)+'</button></div>'+
      '<div class="dfmeta"><span class="sc">✅ <b id="dfok">0</b></span><span class="sc">❌ <b id="dfbad">0</b></span>'+
      '<span class="trk"><i id="dfbar"></i></span><span class="sc" id="dfpos"></span></div>'+
      '<div class="dfbody" id="dfbody"></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click',function(e){ if(e.target===ov) closeDefis(); });
    document.getElementById('dfx').addEventListener('click',closeDefis);
    ov.addEventListener('click',function(e){const bt=e.target.closest('button[data-d]');if(bt)dfAction(bt);});
  }
  ov.style.display='flex';
  paintDefis();
}
function closeDefis(){DEF.on=false;const ov=document.getElementById('dfov');if(ov)ov.style.display='none';}
function paintDefis(){
  const ov=document.getElementById('dfov'); if(!ov)return;
  const m=D[DEF.mi], f=m.fiches[DEF.fi], c=colOf(m);
  _setAcc(c);
  ov.querySelector('.dfhead .t b').textContent=f.titre;
  ov.querySelector('.dfhead .t span').textContent='Défis express · '+m.nom+' · meilleur : '+(_dfBest(DEF.mi,DEF.fi)!=null?_dfBest(DEF.mi,DEF.fi)+' ⭐':'—');
  document.getElementById('dfok').textContent=DEF.ok;
  document.getElementById('dfbad').textContent=DEF.bad;
  const tot=DEF.qs.length, done=Math.min(DEF.i,tot);
  document.getElementById('dfbar').style.width=(tot?(done/tot*100):0)+'%';
  document.getElementById('dfpos').textContent=(tot-done>0?('Défi '+(done+1)+'/'+tot):'Fin');
  const body=document.getElementById('dfbody');
  if(DEF.i>=tot){dfEnd();return;}
  const q=DEF.qs[DEF.i];
  const meta=DEFMETA[q.type];
  const head='<div class="dftag">'+ic(meta[1],13)+' '+meta[0]+'</div>';
  if(q.type==='vf'){ body.innerHTML=head+
      '<div class="dfprompt">'+esc(q.s)+'</div>'+
      '<div class="dfexpl" id="dfexpl"></div>'+
      '<div class="dfvrow"><button class="dfvbtn v1" data-d="v1">✓ Vrai</button><button class="dfvbtn v0" data-d="v0">✗ Faux</button></div>'; }
  else if(q.type==='cloze'){ const opts=_shuf(q.opt.map(function(o,i){return{o,i};}));
    body.innerHTML=head+'<div class="dfblanks">'+esc(q.q).replace(/__/g,'<span style="color:var(--mc);border-bottom:2px solid var(--mc);padding:0 14px">?</span>')+'</div>'+
      '<div class="dfopts">'+opts.map(x=>'<button class="dfopt" data-d="o" data-i="'+x.i+'">'+esc(x.o)+'</button>').join('')+'</div>'+
      '<div class="dfexpl" id="dfexpl"></div>'; }
  else if(q.type==='order'){ DEF.ph=[]; DEF.lock=false;
    body.innerHTML=head+(q.title?'<div class="dfsub">'+esc(q.title)+'</div>':'')+
      (q.consigne?'<div class="dfprompt">'+esc(q.consigne)+'</div>':'')+
      '<div class="dfexpl" id="dfexpl"></div><div class="dfopts" id="ord">'+
      _shuf(q.items.map(function(it,i){return{it,i};})).map(function(x){return '<button class="dfopt" data-d="ord" data-i="'+x.i+'">'+esc(x.it)+'</button>';}).join('')+'</div>'; }
  else if(q.type==='intrus'){ const opts=_shuf(q.items.map(function(it,i){return{it,i};}));
    body.innerHTML=head+(q.title?'<div class="dfsub">'+esc(q.title)+'</div>':'')+
      (q.consigne?'<div class="dfprompt">'+esc(q.consigne)+'</div>':'')+
      '<div class="dfopts">'+opts.map(x=>'<button class="dfopt" data-d="in" data-i="'+x.i+'">'+esc(x.it)+'</button>').join('')+'</div>'+
      '<div class="dfexpl" id="dfexpl"></div>'; }
  else if(q.type==='sort'){ DEF.ph=[]; DEF.lock=false;
    let items=[];Object.keys(q.buckets).forEach(function(cat){q.buckets[cat].forEach(function(it){items.push({it:it,cat:cat});});});
    items=_shuf(items); DEF.ph=items;
    body.innerHTML=head+(q.title?'<div class="dfsub">'+esc(q.title)+'</div>':'')+
      (q.consigne?'<div class="dfprompt">'+esc(q.consigne)+'</div>':'')+
      '<div class="dfcatrow" id="dfcats">'+Object.keys(q.buckets).map(function(cat){return '<button type="button" class="dfcat" data-d="cat" data-cat="'+encodeURIComponent(cat)+'">'+esc(cat)+' <em>0/'+q.buckets[cat].length+'</em></button>';}).join('')+'</div>'+
      '<div id="dfplace"></div><div class="dfexpl" id="dfexpl"></div>';
    dfSortNext(); }
  document.getElementById('dfexpl').classList.remove('show');
}
function _ex(c){document.getElementById('dfexpl').textContent=c;document.getElementById('dfexpl').classList.add('show');}
function dfNext(){DEF.i++;DEF.lock=false;paintDefis();}
function dfAction(bt){
  const d=bt.getAttribute('data-d'), q=DEF.qs[DEF.i]; if(!q)return;
  if(d==='nxt'){dfNext();return;}
  if(DEF.lock)return;
  const ex=document.getElementById('dfexpl');
  if(q.type==='vf'){
    DEF.lock=true;const ok=(d==='v1')===q.v;DEF.last=ok;
    if(ok){DEF.ok++;bt.classList.add('ok');document.getElementById('dfok').textContent=DEF.ok;}
    else{DEF.bad++;bt.classList.add('no');const cor=document.querySelector('.dfvbtn.'+(q.v?'v1':'v0'));if(cor)cor.classList.add('ok');document.getElementById('dfbad').textContent=DEF.bad;}
    _ex((ok?'✓ Exact. ':'✗ Raté. ')+(q.e||''));
    setTimeout(dfNext,ok?650:1800);
  }
  else if(q.type==='cloze'){
    DEF.lock=true;const ok=(+bt.getAttribute('data-i'))===q.a;
    if(ok){DEF.ok++;bt.classList.add('ok');document.getElementById('dfok').textContent=DEF.ok;_ex('✓ Bien vu. '+(q.e||''));setTimeout(dfNext,800);}
    else{DEF.bad++;bt.classList.add('no');document.getElementById('dfbad').textContent=DEF.bad;
      bt.classList.add('off');DEF.lock=false;_ex('✗ Ce n’est pas « '+bt.textContent.trim()+' ». Réessaie !');
      const good=[...document.querySelectorAll('.dfopt[data-d="o"]')].find(x=>+x.getAttribute('data-i')===q.a);
      if(good&&!good.classList.contains('ok')){good.classList.add('ok');DEF.lock=true;setTimeout(dfNext,1100);}
    }
  }
  else if(q.type==='order'){
    const want=q.items[DEF.ph.length];
    if((+bt.getAttribute('data-i'))===DEF.ph.length){ bt.classList.add('done');bt.classList.add('off');DEF.ok++;DEF.ph.push(+bt.getAttribute('data-i'));
      document.getElementById('dfok').textContent=DEF.ok;
      if(DEF.ph.length===q.items.length){_ex('Ordre reconstitué !');DEF.lock=true;setTimeout(dfNext,700);} }
    else{DEF.bad++;bt.classList.add('no');document.getElementById('dfbad').textContent=DEF.bad;setTimeout(function(){bt.classList.remove('no');},420);}
  }
  else if(q.type==='intrus'){
    DEF.lock=true;const ok=(+bt.getAttribute('data-i'))===q.a;
    if(ok){DEF.ok++;bt.classList.add('ok');document.getElementById('dfok').textContent=DEF.ok;_ex('✓ Exact. '+(q.e||''));setTimeout(dfNext,950);}
    else{DEF.bad++;bt.classList.add('no');document.getElementById('dfbad').textContent=DEF.bad;_ex('✗ Ce n’est pas ça. Trouve l’intrus !');
      setTimeout(function(){bt.classList.remove('no');DEF.lock=false;},420);}
  }
  else if(q.type==='sort'){
    const cur=DEF.ph[0];
    if(d==='cat'&&cur){
      const cat=decodeURIComponent(bt.getAttribute('data-cat'));
      const cats=[...document.querySelectorAll('#dfcats .dfcat')];
      const el=cats.find(x=>decodeURIComponent(x.getAttribute('data-cat'))===cat);
      if(el&&el.classList.contains('full')){_ex('Ce thème est déjà complet.');return;}
      if(cat===cur.cat){
        DEF.ok++;DEF.ph.shift();
        if(el){const m=/(\d+)\/(\d+)/.exec(el.textContent);const n=(m?+m[1]:0)+1;const total=+m[2]||q.buckets[cat].length;
          el.innerHTML=''+esc(cat)+' <em>'+n+'/'+total+'</em>';if(n>=total)el.classList.add('full');}
        document.getElementById('dfok').textContent=DEF.ok;dfSortNext();
        if(!DEF.ph.length){_ex('Tout est classé, bravo !');DEF.lock=true;setTimeout(dfNext,800);}
      }
      else{DEF.bad++;document.getElementById('dfbad').textContent=DEF.bad;_ex('Raté : « '+cur.it+' » n’est pas dans « '+cat+' ». Réessaie.');setTimeout(function(){document.getElementById('dfexpl').classList.remove('show');},750);}
    }
  }
}
function dfSortNext(){
  const el=document.getElementById('dfplace');const q=DEF.qs[DEF.i];
  if(!el||!q)return;
  if(!DEF.ph.length){el.innerHTML='';return;}
  const cur=DEF.ph[0];
  el.innerHTML='<div class="dfplace"><span>'+esc(cur.it)+'</span><span class="go" style="pointer-events:none">à classer</span></div>';
}
function dfEnd(){
  const dd=_dfData(DEF.mi,DEF.fi), m=D[DEF.mi], f=m.fiches[DEF.fi], c=colOf(m);
  const total=DEF.ok+DEF.bad; const acc=total?DEF.ok/total:1;
  const stars=acc>=0.98?3:acc>=0.72?2:acc>=0.45?1:0;
  const prev=_dfBest(DEF.mi,DEF.fi)||0; let rec=false;
  if(stars>prev){_dfSave(DEF.mi,DEF.fi,stars);rec=true;}
  const msg=acc>=0.98?'Sans faute. Impressionnant !':acc>=0.72?'Très solide : encore un petit effort !':acc>=0.45?'Bon début : relis la fiche puis retente.':'Relis la fiche : tu vas y arriver.';
  document.getElementById('dfbody').innerHTML='<div class="dfend"><div class="big">'+(dd?dd.e:'🎯')+'</div><h3>Défi terminé !</h3>'+
    '<div class="msg">'+msg+'</div>'+
    '<div class="dfstars">'+[1,2,3].map(i=>'<span class="'+(i<=stars?'on':'')+'">⭐</span>').join('')+'</div>'+
    '<div class="stats"><span>✅ '+DEF.ok+' justes</span><span>❌ '+DEF.bad+' erreurs</span><span>Précision '+Math.round(acc*100)+' %</span></div>'+
    (rec?'<div style="font-size:.85rem;color:var(--mc);font-weight:800;margin-bottom:8px">🏆 Nouveau record sur cette fiche !</div>':'')+
    '<div class="acts"><button class="hbtn primary" style="background:'+c[0]+'" data-d="again">↻ Rejouer</button>'+
    '<button class="hbtn ghost" onclick="fiche('+DEF.mi+','+DEF.fi+',\'lire\')">📖 Revoir la fiche</button>'+
    '<button class="hbtn ghost" onclick="closeDefis()">Fermer</button></div></div>';
  if(stars>=2&&!red()){try{confetti();}catch(e){}}
  DEF.lock=false;
}
/* action « Rejouer » en fin */
const _ddl = dfAction;
dfAction = function(bt){const d=bt.getAttribute('data-d');if(d==='again'){DEF.ok=0;DEF.bad=0;DEF.i=0;DEF.qs=[];DEF.lock=false;openDefis(DEF.mi,DEF.fi);return;} _ddl(bt);};

/* raccourcis clavier : V/F en vrai-faux, Échap ferme, Entrée continue */
document.addEventListener('keydown',function(e){
  if(!DEF.on)return;
  if(e.key==='Escape'){closeDefis();return;}
  const q=DEF.qs[DEF.i]; if(!q)return;
  if(q.type==='vf'){
    if(e.key==='v'||e.key==='V'){e.preventDefault();const b=document.querySelector('.dfvbtn.v1');if(b)dfAction(b);}
    else if(e.key==='f'||e.key==='F'){e.preventDefault();const b=document.querySelector('.dfvbtn.v0');if(b)dfAction(b);}
  }
});
/* exposer aux boutons onclick + rafraîchir la bannière au changement de thème */
window.openDefis=openDefis;

(function(){const _tt=window.toggleTheme;if(typeof _tt==='function'){window.toggleTheme=function(){const before=document.documentElement.getAttribute('data-theme');_tt();const after=document.documentElement.getAttribute('data-theme');if(before!==after&&typeof parse==='function'){try{const p=parse();if(!p.home&&typeof render==='function')render();}catch(e){}}}}})();
/* accès de test / accessibilité des états */
window.dfState=function(){return {i:DEF.i,tot:DEF.qs.length,type:DEF.qs[DEF.i]&&DEF.qs[DEF.i].type,ok:DEF.ok,bad:DEF.bad,on:DEF.on,end:!!document.querySelector('.dfend'),ph:DEF.ph&&DEF.ph.length};};
window.dfPickWrong=function(){const q=DEF.qs[DEF.i];if(!q||DEF.lock)return false;
  if(q.type==='vf'){const s=q.v?'v0':'v1';const el=document.querySelector('.dfvbtn.'+s);if(el){el.click();return true;}}
  if(q.type==='cloze'){const opts=[...document.querySelectorAll('.dfopt[data-d="o"]')];const el=opts.find(x=>+x.getAttribute('data-i')!==q.a&&!x.classList.contains('off'));if(el){el.click();return true;}}
  if(q.type==='intrus'){const opts=[...document.querySelectorAll('.dfopt[data-d="in"]')];const el=opts.find(x=>+x.getAttribute('data-i')!==q.a);if(el){el.click();return true;}}
  return false;};
window.dfClickBest=function(){
  const q=DEF.qs[DEF.i]; if(!q)return false;
  if(q.type==='vf'){const s=q.v?'v1':'v0';const el=document.querySelector('.dfvbtn.'+s);if(el){el.click();return true;}}
  if(q.type==='cloze'){const el=[...document.querySelectorAll('.dfopt[data-d="o"]')].find(x=>+x.getAttribute('data-i')===q.a);if(el){el.click();return true;}}
  if(q.type==='order'){const el=[...document.querySelectorAll('.dfopt[data-d="ord"]')].find(x=>+x.getAttribute('data-i')===DEF.ph.length);if(el){el.click();return true;}}
  if(q.type==='intrus'){const el=[...document.querySelectorAll('.dfopt[data-d="in"]')].find(x=>+x.getAttribute('data-i')===q.a);if(el){el.click();return true;}}
  if(q.type==='sort'){const cur=DEF.ph[0];if(!cur)return false;
    const el=[...document.querySelectorAll('#dfcats .dfcat')].find(x=>decodeURIComponent(x.getAttribute('data-cat'))===cur.cat&&!x.classList.contains('full'));if(el){el.click();return true;}}
  return false;
};

(function(){

/* Fiches couvertes : slug du mp3 dans media/audio/ */
const AUDIOF={'0-0':'ses-croissance','1-0':'hggsp-guerre','1-1':'hggsp-cartographier','2-0':'histoire-1929','3-0':'anglais-heroes','4-0':'philo-intro'};

renderLire = function(mi,fi){
  let s=_baseA(mi,fi);
  const slug=AUDIOF[(mi)+'-'+(fi)];
  if(slug){
    const box='<div class="audiobox"><span class="aic">🎧</span>'+
      '<div class="alab"><b>Réviser en écoutant</b><span>Récapitulatif audio du cours — écoute, puis vérifie ce que tu retiens.</span></div>'+
      '<audio controls preload="none" src="media/audio/'+slug+'.mp3"></audio></div>';
    const i=s.indexOf('<section');
    s = i>0 ? (s.slice(0,i)+box+s.slice(i)) : (box+s);
  }
  return s;
};
